<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>私のwebサイト</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      line-height: 1.6;
      color: #222;
      background: #f7f7f7;
    }

    main {
      max-width: 720px;
      margin: 0 auto;
      padding: 64px 24px;
    }

    h1 {
      margin: 0 0 16px;
      font-size: 2.5rem;
      line-height: 1.2;
    }

    p {
      margin: 0 0 24px;
      font-size: 1.1rem;
    }

    .content {
      padding: 32px;
      background: #fff;
      border: 1px solid #e5e5e5;
      border-radius: 8px;
    }
  </style>
</head>
<body>
  <main>
    <div class="content">
      <h1>こんにちは</h1>
      <p>これはGitHub Pagesで公開するシンプルなWebサイトです。</p>
      <p>このページを編集して、自己紹介や制作物へのリンクを追加できます。</p>
    </div>
  </main>
</body>
</html>
